<!-- SM Shield Logo — Sharif Madber
     Geometric security shield with SM monogram
     Accessible SVG — scalable from 32px favicon to large hero -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" aria-label="Sharif Madber logo">
  <!-- Shield outer -->
  <path
    d="M50 4 L90 22 L90 60 Q90 90 50 116 Q10 90 10 60 L10 22 Z"
    fill="#0B111A"
    stroke="#00E5FF"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Shield inner glow fill -->
  <path
    d="M50 10 L84 26 L84 60 Q84 86 50 110 Q16 86 16 60 L16 26 Z"
    fill="url(#shieldGrad)"
    opacity="0.5"
  />
  <!-- S letter -->
  <text
    x="22"
    y="74"
    font-family="Manrope, system-ui, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="-2"
    fill="#00E5FF"
  >SM</text>
  <!-- Cyan accent line at bottom -->
  <line x1="30" y1="90" x2="70" y2="90" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="shieldGrad" x1="50" y1="0" x2="50" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
